<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-spec 10周年記念トーナメント</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
}

/* 背景グラデーション */
.hero {
  background: radial-gradient(circle at center, #222 0%, #000 70%);
  padding: 60px 20px;
}

.title {
  font-size: 42px;
  font-weight: bold;
  color: #f5c542;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 20px;
  margin-bottom: 30px;
}

.badge {
  display: inline-block;
  background: #f5c542;
  color: #000;
  padding: 10px 20px;
  font-weight: bold;
  border-radius: 50px;
  margin-bottom: 20px;
}

.section {
  padding: 30px 20px;
}

.card {
  background: #111;
  border: 1px solid #333;
  margin: 15px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}

.highlight {
  color: #f5c542;
  font-weight: bold;
}

.big {
  font-size: 28px;
  font-weight: bold;
}

.entry {
  margin-top: 40px;
}

.entry a {
  display: inline-block;
  background: #f5c542;
  color: #000;
  padding: 18px 40px;
  font-size: 22px;
  font-weight: bold;
  border-radius: 10px;
  text-decoration: none;
}

.entry a:hover {
  background: #ffd95e;
}

.footer {
  margin-top: 40px;
  font-size: 12px;
  color: #aaa;
}
</style>

</head>

<body>

<div class="hero">
  <div class="badge">10th ANNIVERSARY</div>

  <div class="title">
    G-spec<br>
    10ボールトーナメント
  </div>

  <div class="subtitle">
    ＊＊月＊＊日 開催
  </div>

  <div class="big">優勝賞金 100,000円</div>
  <div>準優勝　スリーセカンドキューケース</div>
</div>

<div class="section">

  <div class="card">
    <div class="highlight">大会方式</div>
    <div>10ボール 完全シングルイルミネーション</div>
  </div>

  <div class="card">
    <div class="highlight">ハンデ</div>
    <div>SA7 / A6 / B5 / C4</div>
    <div>虚偽の申告は失格とします、みたいな注釈</div>
  </div>

  <div class="card">
    <div class="highlight">エントリー</div>
    <div>64名限定 / 5,000円</div>
  </div>

  <div class="card">
    <div class="highlight">いつもありがとう、お楽しみ全員抽選</div>
    <div class="big">MEZZ ACEキュー</div>
    <div>（バットのみ・20万円相当）</div>
  </div>

  <div class="entry">
    <a href="https://forms.gle/XXXXXXXXXXXX" target="_blank">
      エントリーする
    </a>
  </div>

</div>

<div class="footer">
  © G-spec Tournament
</div>

</body>
</html>
