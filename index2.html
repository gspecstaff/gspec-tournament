<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-spec 10ボールトーナメント</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
}

/* ヒーロー */
.hero {
  background: radial-gradient(circle at center, #111 0%, #000 70%);
  padding: 60px 20px;
}

.badge {
  background: #ff4d6d;
  color: #fff;
  padding: 8px 16px;
  display: inline-block;
  font-weight: bold;
  border-radius: 30px;
  margin-bottom: 15px;
}

.title {
  font-size: 36px;
  font-weight: 800;
  color: #f5c542;
  line-height: 1.2;
  text-shadow: 0 0 10px #f5c542;
}

.subtitle {
  margin: 20px 0;
  font-size: 18px;
  color: #00e5ff;
  font-weight: bold;
}

.big {
  font-size: 28px;
  font-weight: 800;
  color: #ff4d6d;
}

/* カード */
.section {
  padding: 30px 20px;
}

.card {
  background: #111;
  border: 2px solid #fff;
  margin: 15px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}

.highlight {
  font-weight: bold;
  color: #00e5ff;
  margin-bottom: 10px;
}

/* ボタン */
.entry a {
  display: inline-block;
  margin-top: 30px;
  padding: 18px 40px;
  font-size: 22px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #f5c542, #ff4d6d);
  border-radius: 12px;
  text-decoration: none;
  box-shadow: 0 0 20px rgba(255,77,109,0.7);
}

.footer {
  margin-top: 40px;
  font-size: 12px;
  color: #aaa;
}

@media (max-width: 480px) {
  .title {
    font-size: 28px;
  }
}
</style>

</head>

<body>

<div class="hero">
  <div class="badge">10th ANNIVERSARY</div>

  <div class="title">
    G-spec<br>
    10ボール<br>
    トーナメント
  </div>

  <div class="subtitle">＊＊月＊＊日 開催</div>

  <div class="big">優勝賞金 100,000円</div>
</div>

<div class="section">

  <div class="card">
    <div class="highlight">大会方式</div>
    <div>10ボール 完全シングルイルミネーション</div>
  </div>

  <div class="card">
    <div class="highlight">ハンデ</div>
    <div>SA7 / A6 / B5 / C4</div>
  </div>

  <div class="card">
    <div class="highlight">エントリー</div>
    <div>64名 / 5,000円</div>
  </div>

  <div class="card">
    <div class="highlight">お楽しみ抽選</div>
    <div class="big">MEZZ ACEキュー</div>
  </div>

  <div class="entry">
    <a href="https://forms.gle/XXXXXXXXXXXX" target="_blank">
      エントリーする
    </a>
  </div>

</div>

<div class="footer">
  © G-spec Tournament
</div>

</body>
</html>
